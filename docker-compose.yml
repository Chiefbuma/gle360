
services:
  loan-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: loan-app
    container_name: loan-app
    volumes:
      - .:/var/www
    depends_on:
      - loan-mysql
    networks:
      - loan_default

  loan-nginx:
    image: nginx:latest
    container_name: loan-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - loan-app
    networks:
      - loan_default

  loan-mysql:
    image: mysql:8.0
    container_name: loan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_lms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - loan_default

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: loan-app-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: loan-mysql
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - loan-mysql
    networks:
      - loan_default

networks:
  loan_default:
    driver: bridge

volumes:
  dbdata: